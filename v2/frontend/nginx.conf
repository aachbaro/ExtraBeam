server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Block sensitive files
    location ~* /\.(env|git|gitignore|htaccess|htpasswd|DS_Store)$ {
        deny all;
        return 404;
    }

    location /api/ {
        proxy_pass http://extrabeam-v2-back:8002;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve the original public scheme from the upstream reverse proxy
        # (Cloudflare tunnel / Caddy), otherwise Django generates OIDC callback
        # URLs in http://... and auth-server rejects them.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
